<p-dialog
  [visible]="true"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="true"
  [header]="isAdd ? 'Add Category' : 'Edit Category'"
  [style]="{ width: '600px' }"
  (onHide)="close()"
>
  <form [formGroup]="form" (ngSubmit)="save()">
    <p-fluid>
      @if (item) {
        <div class="field">
          <label for="edit-id">Id</label>
          <div id="edit-id" class="id-display">{{ item.id }}</div>
        </div>
      }

      <div class="field">
        <label for="edit-name">Name</label>
        <input
          id="edit-name"
          type="text"
          pInputText
          formControlName="name"
          [readonly]="!canEdit"
        />
        @if (form.get('name')?.invalid && form.get('name')?.touched) {
          @if (form.get('name')?.hasError('required')) {
            <small class="p-error">Field is required</small>
          }
          @if (form.get('name')?.hasError('nameTaken')) {
            <small class="p-error">Name is already taken</small>
          }
        }
        @if (form.get('name')?.pending) {
          <small class="p-message-info">Checking...</small>
        }
      </div>
    </p-fluid>

    <ng-template pTemplate="footer">
      <div class="dialog-footer">
        <p-button type="button" label="Close" severity="secondary" (click)="close()" />
        @if (canEdit) {
          <p-button
            type="submit"
            label="Save"
            [disabled]="form.invalid || form.pending"
          />
        }
      </div>
    </ng-template>
  </form>
</p-dialog>
