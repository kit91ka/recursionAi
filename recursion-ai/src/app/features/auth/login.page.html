<div class="login-wrapper">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <p-card [style]="{ width: '439px' }">
      <h2 class="card-title">Logon to Zidium</h2>

      <p-fluid>
        <div class="field">
          <label for="login">Login</label>
          <input
            id="login"
            type="text"
            pInputText
            formControlName="login"
            autocomplete="username"
            [class.ng-invalid]="form.get('login')?.invalid && form.get('login')?.touched"
          />
          @if (form.get('login')?.invalid && form.get('login')?.touched) {
            <small class="p-error">Field is required</small>
          }
        </div>

        <div class="field">
          <label for="password">Password</label>
          <p-password
            id="password"
            formControlName="password"
            autocomplete="current-password"
            [feedback]="false"
            [class.ng-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
          />
          @if (form.get('password')?.hasError('required') && form.get('password')?.touched) {
            <small class="p-error">Field is required</small>
          }
        </div>
      </p-fluid>

      @if (serverError()) {
        <small class="p-error server-error">{{ serverError() }}</small>
      }
      <p-button
        type="submit"
        label="Logon"
        [loading]="loading"
        [disabled]="form.invalid || loading"
        [style]="{ width: '100%' }"
      />
    </p-card>
  </form>
</div>
